.hm-year{
    width:100%;
    overflow-x:auto;
    padding:10px 0 8px;
}
.hm-months{
    display:grid;
    grid-template-columns:repeat(53,8px);
    gap:3px;
    min-width:max-content;
    height:16px;
    font-size:9px;
    color:var(--mu);
}
.hm-months span{
    white-space:nowrap;
}
.hm-content{
    display:flex;
    gap:9px;
    min-width:max-content;
}
.hm-days{
    display:grid;
    grid-template-rows:repeat(7,8px);
    gap:3px;
    width:19px;
    font-size:9px;
    color:var(--mu);
}
.hm-days span{
    line-height:8px;
}
.hm-grid{
    display:grid;
    grid-template-rows:repeat(7,8px);
    grid-auto-columns:8px;
    grid-auto-flow:column;
    gap:3px;
}
.hm-grid i{
    width:8px;
    height:8px;
    border-radius:2px;
    background:#EBEDF0;
    display:block;
    font-style:normal;
    cursor:pointer;
}
.hm-grid .c1{background:#ACE0C0}
.hm-grid .c2{background:#40B879}
.hm-grid .c3{background:#087A43}
.hm-grid .no-data{
    background:#D8DDE5;
}
.hm-legend .no-data{
    background:#D8DDE5;
}
.hm-grid .future{
    visibility:hidden;
}
.hm-legend{
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:5px;
    margin-top:12px;
    font-size:11px;
    color:var(--mu);
}
.hm-legend i{
    width:9px;
    height:9px;
    border-radius:2px;
    background:#EBEDF0;
}
.hm-legend .c1{background:#ACE0C0}
.hm-legend .c2{background:#40B879}
.hm-legend .c3{background:#087A43}

/* HEATMAP - PHÓNG TO VỪA KHUNG */
/* HEATMAP - PIXEL LỚN, SÁT NHAU */
@media(min-width:701px){
    .hm-year{
        overflow-x:hidden;
        padding:8px 0 4px;
    }

    .hm-months{
        margin-left:26px;
        width:calc(100% - 26px);
        min-width:0;
        grid-template-columns:repeat(53,minmax(0,1fr));
        gap:2px;
        height:20px;
        font-size:10px;
    }

    .hm-content{
        display:flex;
        gap:7px;
        width:100%;
        min-width:0;
    }

    .hm-days{
        width:19px;
        flex-shrink:0;
        grid-template-rows:repeat(7,1fr);
        gap:2px;
        font-size:10px;
    }

    .hm-days span{
        line-height:normal;
        align-self:center;
    }

    .hm-grid{
        display:grid;
        flex:1;
        min-width:0;
        width:calc(100% - 26px);
        aspect-ratio:53 / 7;
        grid-template-columns:repeat(53,minmax(0,1fr));
        grid-template-rows:repeat(7,minmax(0,1fr));
        grid-auto-flow:column;
        gap:2px;
    }

    .hm-grid i{
        width:100%;
        height:100%;
        min-width:0;
        min-height:0;
        border-radius:3px;
    }
}
/* Điện thoại vẫn giữ khả năng cuộn ngang */
@media(max-width:700px){
    .hm-year{
        overflow-x:auto;
    }

    .hm-months{
        margin-left:28px;
        width:auto;
        min-width:max-content;
        grid-template-columns:repeat(53,8px);
        gap:3px;
    }

    .hm-content{
        width:auto;
        min-width:max-content;
    }

    .hm-days{
        grid-template-rows:repeat(7,8px);
        gap:3px;
        width:19px;
    }

    .hm-days span{
        line-height:8px;
    }

    .hm-grid{
        flex:none;
        width:max-content;
        grid-template-columns:repeat(53,8px);
        grid-template-rows:repeat(7,8px);
        gap:3px;
    }

    .hm-grid i{
        width:8px;
        height:8px;
    }
}

/* TIẾN ĐỘ - BỐ CỤC GỌN */
.progress-goal,
.progress-overview,
.progress-srs{
    padding:12px 14px;
    margin-bottom:9px;
}

.progress-goal h3,
.progress-overview h3,
.progress-srs h3{
    margin:0 0 8px;
    font-size:15px;
}

.progress-goal .goal-info{
    display:flex;
    justify-content:space-between;
    margin:9px 0 7px;
    font-size:13px;
}

.progress-overview .new-summary{
    display:flex;
    gap:18px;
    flex-wrap:wrap;
    font-size:13px;
    margin-bottom:10px;
}

.level-summary{
    display:grid;
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:7px;
}

.level-item{
    background:var(--bg);
    border-radius:10px;
    padding:8px;
    display:flex;
    flex-direction:column;
    gap:2px;
}

.level-item small{
    font-size:11px;
    font-weight:800;
    color:var(--tx);
}

.level-item b{
    font-size:20px;
    line-height:1.2;
}

.level-item span{
    font-size:11px;
    color:var(--mu);
}

.srs-summary{
    display:grid;
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:8px;
    margin:10px 0;
}

.srs-summary div{
    display:flex;
    flex-direction:column;
    gap:2px;
}

.srs-summary b{
    font-size:21px;
    line-height:1.2;
    font-weight:800;
    font-variant-numeric:tabular-nums;
}

.srs-summary span{
    font-size:11px;
    color:var(--mu);
}

.srs-purple{color:#6552cc}
.srs-green{color:#16865d}
.srs-orange{color:#b56a16}
.srs-blue{color:#2876bd}

.srs-ratings{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    font-size:12px;
    margin-top:10px;
}

.srs-ratings span{
    background:var(--bg);
    border-radius:8px;
    padding:4px 8px;
}

.srs-note{
    color:var(--mu);
    font-size:11px;
    margin:8px 0 0;
}

@media(max-width:500px){
    .level-summary,
    .srs-summary{
        grid-template-columns:repeat(2,minmax(0,1fr));
    }
}

<script>

const K='vocab12_v1',uid=()=>Math.random().toString(36).slice(2,9),today=()=>new Date().toLocaleDateString('sv'),shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

let S=(()=>{try{const d=JSON.parse(localStorage.getItem(K));if(d&&d.topics)return d}catch(e){}return{

const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}if(typeof qs=='function')qs()};
function normalizeStats(){
    S.words=S.words||[];
    S.daily=S.daily||{};
    S.fc=S.fc||{};
    S.newDaily=S.newDaily||{};

    if(!S.srsStats){
        S.srsStats={
            total:Object.values(S.fc).reduce((a,b)=>a+(Number(b)||0),0),
            correct:S.words.reduce((a,w)=>a+(Number(w.reps)||0),0),
            again:0,
            hard:0,
            good:0,
            easy:0,
            days:{}
        };
    }

    const st=S.srsStats;
    ['total','correct','again','hard','good','easy'].forEach(k=>{
        st[k]=Number(st[k])||0;
    });

    st.days=st.days||{};

    S.statsStart=S.statsStart||
        Object.keys(S.newDaily).sort()[0]||
        today();

const wordsOf=()=>S.cur=='all'?S.words:S.words.filter(w=>w.tid==S.cur);

const dueL=()=>wordsOf().filter(w=>w.due>0&&w.due<=Date.now());
const revLeft=()=>Math.max(0,(S.revCap||100)-((S.revDaily&&S.revDaily[today()])||0));

            `).join('')}

    </div>`;
}

/* stats */
function streak(){let n=0,d=new Date();if(!S.daily[today()])d.setDate(d.getDate()-1);while((S.daily[d.toLocaleDateString('sv')]||0)>0){n++;d.setDate(d.getDate()-1)}return n}

function vStats(){
    const d=S.newDaily[today()]||0;
    const p=Math.min(100,Math.round(d/S.goal*100));

    const end=new Date();
    end.setHours(0,0,0,0);

    const sumNew=n=>{
        let total=0;
        for(let i=0;i<n;i++){
            const date=new Date(end);
            date.setDate(date.getDate()-i);
            total+=Number(S.newDaily[date.toLocaleDateString('sv')])||0;
        }
        return total;
    };

    const new7=sumNew(7);
    const new30=sumNew(30);

    const ws=S.words||[];
    const seen=ws.filter(w=>!isNewW(w));
    const unseen=ws.length-seen.length;
    const levels=[1,2,3,4].map(lv=>
        seen.filter(w=>(w.level||1)===lv).length
    );

    const st=S.srsStats;
    let total7=0,correct7=0;

    for(let i=0;i<7;i++){
        const date=new Date(end);
        date.setDate(date.getDate()-i);
        const day=st.days[date.toLocaleDateString('sv')]||{};
        total7+=day.total||0;
        correct7+=day.correct||0;
    }

    const rate7=total7
        ?Math.round(correct7/total7*100)+'%'
        :'—';

    const due=ws.filter(w=>w.due>0&&w.due<=Date.now()).length;

    const start=new Date(end);
    start.setDate(start.getDate()-((start.getDay()+6)%7));
    start.setDate(start.getDate()-52*7);

    let cells='';
    let months='';

    for(let w=0;w<53;w++){
        const weekStart=new Date(start);
        weekStart.setDate(start.getDate()+w*7);

        if(w===0||weekStart.getDate()===1){
            months+=`<span style="grid-column:${w+1}">${weekStart.toLocaleDateString('vi',{month:'short'})}</span>`;
        }

        for(let j=0;j<7;j++){
            const date=new Date(weekStart);
            date.setDate(weekStart.getDate()+j);

            const key=date.toLocaleDateString('sv');
            const count=Number(S.newDaily[key])||0;
            const noData=key<S.statsStart;

            let cls=noData?'no-data':'';
            if(!noData){
                if(count>=20)cls='c3';
                else if(count>=10)cls='c2';
                else if(count>0)cls='c1';
            }

            const future=date>end?'future':'';
            const detail=noData?'Chưa có dữ liệu lịch sử':count+' từ mới';

            cells+=`<i class="${cls} ${future}"
                title="${key}: ${detail}"
                onclick="toast('${key}: ${detail}')"></i>`;
        }
    }

    return`
    <div class="card progress-goal">
        <h3>🎯 Mục tiêu hôm nay</h3>
        <div class="goal-info">
            <span>Đã học: <b>${d}/${S.goal}</b> từ mới</span>
            <span><b>${p}%</b></span>
        </div>
        <div class="bar d"><i style="width:${p}%"></i></div>
        <div class="tb" style="margin-top:10px">
            Đổi mục tiêu:
            <input type="number" min="1" value="${S.goal}"
                style="width:90px"
                onchange="S.goal=Math.max(1,+this.value||30);render()">
            từ mới/ngày
        </div>
    </div>

    <div class="card">
        <div class="rowb">
            <h3>🔥 Streak: ${streak()} ngày</h3>
        </div>
        <div class="hm-year">
            <div class="hm-months">${months}</div>
            <div class="hm-content">
                <div class="hm-days">
                    <span></span>
                    <span>T2</span>
                    <span></span>
                    <span>T4</span>
                    <span></span>
                    <span>T6</span>
                    <span></span>
                </div>
                <div class="hm-grid">${cells}</div>
            </div>
        </div>
        <div class="hm-legend">
            Chưa theo dõi
            <i class="no-data"></i>
            Không học
            <i></i>
            Ít
            <i class="c1"></i>
            <i class="c2"></i>
            <i class="c3"></i>
            Nhiều
        </div>
    </div>

    <div class="card progress-overview">
        <h3>📊 Từ vựng · tất cả bài</h3>

        <div class="new-summary">
            <span>Chưa học: <b>${unseen}</b></span>
            <span>Đã học: <b>${seen.length}</b></span>
            <span>7 ngày: <b>${new7}</b> từ mới</span>
            <span>30 ngày: <b>${new30}</b> từ mới</span>
        </div>

        <div class="level-summary">
            ${levels.map((n,i)=>`
                <div class="level-item">
                    <small>Level ${i+1}</small>
                    <b>${n}</b>
                    <span>${WORD_LEVELS[i].name}</span>
                </div>
            `).join('')}
        </div>
    </div>

    <div class="card progress-goal">
        <h3>🔁 Giới hạn ôn tập</h3>
        <div class="tb">
            Tối đa thẻ ôn mỗi ngày:
            <input type="number" min="10" value="${S.revCap||100}"
                style="width:90px"
                onchange="S.revCap=Math.max(10,+this.value||100);render()">
        </div>
    </div>

    <div class="card progress-srs">
        <h3>🧠 Chất lượng ghi nhớ SRS</h3>

        <div class="srs-summary">
            <div><b class="srs-purple">${st.total}</b><span>Tổng lượt ôn</span></div>
            <div><b class="srs-green">${st.correct}</b><span>Nhớ đúng</span></div>
            <div><b class="srs-orange">${rate7}</b><span>Tỷ lệ đúng · 7 ngày</span></div>
            <div><b class="srs-blue">${due}</b><span>Thẻ đến hạn ôn</span></div>
        </div>

        <div class="srs-ratings">
            <span>Again <b>${st.again}</b></span>
            <span>Hard <b>${st.hard}</b></span>
            <span>Good <b>${st.good}</b></span>
            <span>Easy <b>${st.easy}</b></span>
        </div>

        <p class="srs-note">Tỷ lệ 7 ngày được tính từ những lượt ôn đã ghi nhận kể từ khi bật thống kê.</p>
    </div>`;
}

/* SRS */
const WORD_LEVELS = [
    {name:'Mới học',color:'#3979B9',bg:'#D6EBFF'},
    {name:'Đang học',color:'#8063B5',bg:'#E5DCFF'},
    {name:'Đã nhớ',color:'#B88725',bg:'#FFF0C9'},
    {name:'Thuần thục',color:'#398B65',bg:'#D5F2DF'}
];

const isNewW=w=>!w.fcSeen&&!(w.due>0)&&!(w.reps>0);
const LEVELS=WORD_LEVELS;
function levelBadge(w){
    const lv=Math.min(4,Math.max(1,w.level||1));
    const c=WORD_LEVELS[lv-1];
    return `<span style="display:inline-block;padding:3px 7px;border-radius:7px;background:${c.bg};color:${c.color};font-size:11px;font-weight:800;white-space:nowrap">Level ${lv} · ${c.name}</span>`;
}
const isHard=w=>(w.lapses||0)>=8;
function statusBadge(w){return statusBadge0(w)+(isHard(w)?` <span style="display:inline-block;padding:3px 7px;border-radius:7px;background:#FFE0E6;color:#A32D2D;font-size:11px;font-weight:800;white-space:nowrap">⚠️ Từ khó</span>`:'')}
function statusBadge0(w){
    return isNewW(w)
        ?`<span style="display:inline-block;padding:3px 7px;border-radius:7px;background:#ECEAF3;color:#6b6785;font-size:11px;font-weight:800;white-space:nowrap">Chưa học</span>`
        :levelBadge(w);
}

function updateWordLevel(w,r){
    const old=w.level||1,iv=w.ivl||0;
    const nl=iv>=21?4:iv>=7?3:iv>=2?2:1;
    w.level=nl;
    if(nl>old)toast('🎉 Từ đã lên Level '+nl);
}
function updateWordLevelOld(w,r){
    if(r===0)return;

    w.level = w.level || 1;
    w.levelCorrect = w.levelCorrect || 0;
    w.levelDates = w.levelDates || [];

    const day = today();

    w.levelCorrect++;

    if(!w.levelDates.includes(day)){
        w.levelDates.push(day);
    }

    const days = w.levelDates;
    const first = new Date(days[0]+'T00:00:00');
    const last = new Date(days[days.length-1]+'T00:00:00');
    const span = (last-first)/86400000;

    let promote = false;

    if(w.level===1){
        promote = w.levelCorrect>=2 && days.length>=2;
    }

    if(w.level===2){
        promote = w.levelCorrect>=4 && days.length>=3 && span>=7;
    }

    if(w.level===3){
        promote = w.levelCorrect>=6 && days.length>=5 && span>=30;
    }

    if(promote && w.level<4){
        w.level++;
        w.levelCorrect=0;
        w.levelDates=[];
        toast('🎉 Từ đã lên Level '+w.level);
    }
}
const dayDue=(n,days)=>{const d=new Date(n);d.setHours(0,0,0,0);d.setDate(d.getDate()+days);return d.getTime()};
function rate(w,r,updateLevel=true){const n=Date.now(),M=6e4,D=864e5,st=[1,10];if(r==0)w.lapses=(w.lapses||0)+1;
if(w.step>=0){if(r==0){w.step=0;w.due=n+M}else if(r==1)w.due=n+(w.step?10:6)*M;else if(r==2){w.step++;if(w.step>=2){w.step=-1;w.ivl=Math.max(1,w.ivl);w.due=dayDue(n,w.ivl)}else w.due=n+st[w.step]*M}else{w.step=-1;w.ivl=Math.max(4,w.ivl);w.due=dayDue(n,w.ivl)}}
else{if(r==0){w.ease=Math.max(1.3,w.ease-.2);w.ivl=Math.max(1,Math.round(w.ivl*.5));w.step=0;w.due=n+M}else{if(r==1){w.ivl=Math.max(w.ivl+1,Math.round(w.ivl*1.2));w.ease=Math.max(1.3,w.ease-.15)}else if(r==2)w.ivl=Math.max(w.ivl+1,Math.round(w.ivl*w.ease));else{w.ivl=Math.max(w.ivl+1,Math.round(w.ivl*w.ease*1.3));w.ease+=.15}w.due=dayDue(n,w.ivl)}}
if(r>0)w.reps++;

    ${DELMODE ? `<input type="checkbox" ${DEL.has(w.id)?'checked':''} onchange="toggleDelW('${w.id}',this.checked)">` : ''}
    <button class="sm" onclick="say('${w.id}')">🔊</button>
    <div class="wi">
    <div class="wt">
        <span class="wt-l"><b>${esc(w.en)}</b> <span class="mu">${esc(w.ipa)} ${esc(w.type)}</span> ${w.cefr?`<span class="tag">${w.cefr}</span>`:''}</span>
        ${statusBadge(w)}
    </div>
    <div>${esc(w.vi)}${SC=='all'?` <small class="mu">· ${esc(S.topics.find(t=>t.id==w.tid)?.name)}</small>`:''}</div>
</div>
    <div class="wa">
        <button class="sm" title="Xem thẻ" onclick="pv('${w.id}')">👁️</button>
        <button class="sm" title="Sửa" onclick="EDIT='${w.id}';render();scrollTo(0,0)">✏️</button>
        <button class="sm" title="Xóa từ" style="color:var(--no)" onclick="delW('${w.id}')">🗑️</button>
    </div>
</div>`).join('');
    const c=$('#delCount');
    if(c)c.textContent=DEL.size;
}
function saveW(){const o={};F.forEach(([k])=>o[k]=$('#f_'+k).value.trim());const tid=$('#f_tid').value;if(!o.en||!o.vi)return toast('Cần nhập từ và nghĩa');if(S.words.some(w=>w.tid==tid&&w.id!=EDIT&&w.en.toLowerCase()==o.en.toLowerCase()))return toast('Từ đã tồn tại trong bài này');if(EDIT)Object.assign(S.words.find(w=>w.id==EDIT),o,{tid,lapses:0});else S.words.push(mk(tid,o));EDIT=null;SHOWF=0;render()}
function delW(id){if(!sure('Xóa từ'))return;S.words=S.words.filter(w=>w.id!=id);if(EDIT==id){EDIT=null;SHOWF=0}render()}
function toggleDelW(id,checked){
if(checked)DEL.add(id);
else DEL.delete(id);
const c=$('#delCount');
if(c)c.textContent=DEL.size;
}

function selectAllW(){
filteredW().forEach(w=>DEL.add(w.id));
list();
}

function deleteSelectedW(){
if(!DEL.size)return toast('Chưa chọn từ nào');
if(!sure(`Xóa ${DEL.size} từ đã chọn`))return;
S.words=S.words.filter(w=>!DEL.has(w.id));
DEL.clear();
DELMODE=false;
render();
}
/* pomodoro */
let PM={m:'f',f:25,left:1500,run:0,tm:0};const mmss=s=>String(s/60|0).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function pUp(){const a=$('#pt');if(a)a.textContent=mmss(PM.left);const b=$('#pl');if(b)b.textContent=PM.m=='f'?'📖 Đang học':'☕ Nghỉ 5 phút'}
function pGo(){if(PM.run)return;PM.run=1;snd.ps();PM.tm=setInterval(()=>{PM.left--;if(PM.left<=0){snd.pe();PM.m=PM.m=='f'?'b':'f';PM.left=(PM.m=='f'?PM.f:5)*60;toast(PM.m=='f'?'⏰ Hết giờ nghỉ – quay lại học nào!':'🎉 Hết giờ học – nghỉ 5 phút!');setTimeout(snd.ps,1500)}pUp()},1000)}
const pPause=()=>{clearInterval(PM.tm);PM.run=0},pReset=()=>{pPause();PM.m='f';PM.left=PM.f*60;pUp()};
function vPomo(){return`<div class="card ctr"><h3>🍅 Pomodoro</h3><div id="pl" class="mu"></div><div class="pt" id="pt"></div><div class="tb" style="justify-content:center;margin:12px"><button class="btn" onclick="pGo()">Start</button><button class="btn g" onclick="pPause()">Pause</button><button class="btn g" onclick="pReset()">Reset</button></div><div>Thời gian học: <input type="number" min="1" max="180" value="${PM.f}" style="width:80px" onchange="PM.f=Math.max(1,+this.value||25);if(!PM.run)pReset()"> phút · Nghỉ: 5 phút</div></div>`}
setInterval(pUp,500);
/* import/export */
const XO=new Set();
const FMT='English | Meaning | Type | IPA | Example 1 | Example 2 | Synonym = nghĩa; | Antonym = nghĩa; | Collocations & Phrases = nghĩa; | CEFR';
function vIO(){return`${vSY()}<div class="card"><h3>📥 Nhập hàng loạt vào bài đang chọn</h3><p class="mu">Mỗi dòng một từ, cách nhau bằng dấu | </p><code style="font-size:16px;display:block;margin-bottom:8px">${FMT}</code><div class="tb" style="margin-bottom:8px"><button class="sm" onclick="cp(FMT)">Sao chép dòng format</button></div><textarea id="imp" placeholder="${FMT}"></textarea><br><button class="btn" onclick="doImp()">Nhập dữ liệu</button><p id="ir" class="mu"></p></div><div class="card"><h3>📤 Xuất file .txt</h3><div class="tb"><button class="sm" onclick="X=new Set(S.words.map(w=>w.id));render()">Chọn tất cả từ</button><button class="sm" onclick="X=new Set();render()">Bỏ chọn</button></div>${S.topics.map(t=>{const ws=S.words.filter(w=>w.tid==t.id);return`<details class="xt" ${XO.has(t.id)?'open':''} ontoggle="this.open?XO.add('${t.id}'):XO.delete('${t.id}')"><summary><input type="checkbox" ${ws.length&&ws.every(w=>X.has(w.id))?'checked':''} onclick="event.stopPropagation()" onchange="xT('${t.id}',this.checked)"> <b>${esc(t.name)}</b> <small class="mu">(${ws.length} từ)</small></summary><div class="xw">${ws.map(w=>`<label><input type="checkbox" ${X.has(w.id)?'checked':''} onchange="xW('${w.id}',this.checked)"> ${esc(w.en)}</label>`).join('')}</div></details>`}).join('')}<p><button class="btn" onclick="dl()">Tải file .txt</button> <button class="btn g" onclick="cp($('#eo').value)">Sao chép nội dung</button></p><textarea id="eo" readonly></textarea></div>`}
function xT(id,c){S.words.filter(w=>w.tid==id).forEach(w=>c?X.add(w.id):X.delete(w.id));render()}
function xW(id,c){c?X.add(id):X.delete(id);ioOut()}
function ioOut(){const e=$('#eo');if(!e)return;e.value=S.topics.map(t=>{const ws=S.words.filter(w=>w.tid==t.id&&X.has(w.id));return ws.length?`## ${t.name}\n`+ws.map(w=>F.map(([k])=>w[k]||'').join(' | ')).join('\n'):''}).filter(Boolean).join('\n\n')}
function cp(t){try{navigator.clipboard.writeText(t).then(()=>toast('Đã sao chép'),()=>toast('Hãy copy thủ công'))}catch(e){toast('Hãy copy thủ công')}}
function dl(){ioOut();const t=$('#eo').value;if(!t)return toast('Chưa chọn từ nào');try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/plain'}));a.download='vocab-export.txt';a.click()}catch(e){}toast('Nếu file không tải được, hãy dùng nút Sao chép')}
function doImp(){if(S.cur=='all')return $('#ir').textContent='Hãy chọn một bài cụ thể ở thanh trên.';let ok=0,sk=0;$('#imp').value.split('\n').forEach(l=>{l=l.trim();if(!l||l.startsWith('#'))return;const p=l.split('|').map(s=>s.trim()),o=Object.fromEntries(F.map(([k],i)=>[k,p[i]||'']));if(!o.en||!o.vi||o.en.toLowerCase()=='english'||S.words.some(w=>w.tid==S.cur&&w.en.toLowerCase()==o.en.toLowerCase()))return sk++;S.words.push(mk(S.cur,o));ok++});save();$('#ir').textContent=`✅ Thêm thành công ${ok} từ · bỏ qua ${sk} dòng (thiếu dữ liệu/trùng).`}
const FB='https://voca-3a3d7-default-rtdb.asia-southeast1.firebasedatabase.app/vocab12/';
const gsc=()=>{try{return localStorage.getItem('v12sc')||''}catch(e){return ''}};
let SY={code:gsc(),last:'',busy:0,tm:0};
const snap=()=>{const{ts,...r}=S;return JSON.stringify(r)};
function qs(){if(SY.code&&snap()!==SY.last){clearTimeout(SY.tm);SY.tm=setTimeout(autoSync,3000)}}
async function autoSync(){if(!SY.code||SY.busy)return;SY.busy=1;
try{const u=FB+encodeURIComponent(SY.code)+'.json',cur=snap();let d=null;
if(!G&&!/INPUT|TEXTAREA/.test(document.activeElement?.tagName||'')){const r=await fetch(u);if(r.ok)d=await r.json()}
const rts=d&&d.topics?(d.ts||0):0;
if(rts>(S.ts||0)&&(SY.last===''||cur===SY.last)){S={goal:30,daily:{},fc:{},words:[],...d};SY.last=snap();save();render();toast('🔄 Đã cập nhật từ thiết bị khác')}
else if(cur!==SY.last){S.ts=Date.now();SY.last=snap();save();await fetch(u,{method:'PUT',body:JSON.stringify(S)})}
}catch(e){}SY.busy=0}
function syOn(){const c=($('#sc').value||'').trim();if(c.length<8)return toast('Mã tối thiểu 8 ký tự');try{localStorage.setItem('v12sc',c)}catch(e){}SY.code=c;SY.last='';autoSync().then(()=>{toast('🔄 Đã bật đồng bộ tự động');render()})}
function syOff(){SY.code='';try{localStorage.removeItem('v12sc')}catch(e){}toast('Đã tắt đồng bộ');render()}
function vSY(){return`<div class="card"><h3>🔄 Đồng bộ tự động (Firebase)</h3><p class="mu">${SY.code?'🟢 Đang bật: dữ liệu tự đẩy lên sau mỗi thay đổi và tự cập nhật khi mở lại trang.':'⚪ Chưa bật. Nhập cùng một mã trên mọi thiết bị rồi bấm Bật.'}</p><div class="tb"><input id="sc" placeholder="Mã đồng bộ (≥ 8 ký tự)" value="${esc(gsc())}"><button class="btn" onclick="syOn()">Bật đồng bộ</button><button class="btn g" onclick="syOff()">Tắt</button></div></div>`}
setInterval(autoSync,30000);
addEventListener('visibilitychange',()=>{if(!document.hidden)autoSync()});addEventListener('online',autoSync);
setTimeout(autoSync,1500);

function pv(id){
    const w=S.words.find(x=>x.id==id);
    if(!w)return;
    let o=$('#ov');
    if(!o){o=document.createElement('div');o.id='ov';o.onclick=pvX;document.body.appendChild(o)}
    o.innerHTML=`<div class="ovb" onclick="event.stopPropagation()">
        <div class="rowb" style="margin-bottom:8px"><b>👁️ Xem trước thẻ</b><button class="sm" onclick="pvX()">✕ Đóng</button></div>
        <div class="card fc" style="cursor:default;margin:0">
            ${fTags(w)}
            <div style="position:absolute;top:14px;left:14px">${statusBadge(w)}</div>
            <div class="big"><span class="bw">${esc(w.en)}<button class="sm sp" onclick="say('${w.id}')">🔊</button></span></div>
            <div class="mu"><i>${esc(w.ipa)}</i></div>
            ${backHTML(w)}
        </div>
    </div>`;
    o.style.display='flex';
}
function pvX(){const o=$('#ov');if(o)o.style.display='none'}
addEventListener('keydown',e=>{if(e.key=='Escape')pvX()});
function fit(){document.querySelectorAll('.fg textarea').forEach(t=>{t.style.height='auto';t.style.height=(t.scrollHeight+t.offsetHeight-t.clientHeight)+'px'})}
addEventListener('resize',fit);
function renT(){if(S.cur=='all')return toast('Hãy chọn một bài cụ thể');const n=$('#nt').value.trim();if(!n)return toast('Nhập tên mới vào ô trên rồi bấm Đổi tên');const t=S.topics.find(x=>x.id==S.cur);if(t){t.name=n;render();toast('✅ Đã đổi tên bài')}}
function skipN(){if(!G||!G.qs)return;clearInterval(G.tm);clearTimeout(G.adv);if(!G.ans&&G.res[G.i]===undefined&&['write','fill','lsent','lword'].includes(G.m)){G.res[G.i]=false;rec(0);G.ok=G.res.filter(x=>x===true).length;G.no=G.res.filter(x=>x===false).length;G.st=0;toast('⏭ Bỏ qua – tính sai. Đáp án: '+(G.m=='fill'?G.say:G.key))}G.i++;nextQ()}
function backQ(){if(!G||!G.qs)return;if(G.i<=0)return toast('Đây là từ đầu tiên');clearInterval(G.tm);clearTimeout(G.adv);G.i--;nextQ()}
function clrQ(){const i=$('#sq');i.value='';Q='';window.list();i.focus()}
render();
</script></body></html>
